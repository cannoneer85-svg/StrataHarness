name: Bug Report
description: Report a bug or unexpected behavior in the Template
title: "fix: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us investigate and resolve it.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Clear description of expected behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Environment information where the problem occurred.
      value: |
        - OS: [e.g. Windows 11 / Ubuntu 22.04 / macOS]
        - PowerShell Version: [e.g. 7.4.x (`$PSVersionTable.PSVersion`)]
        - Git Version: [e.g. 2.43.0 (`git --version`)]
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any relevant logs, terminal output, error messages, or screenshots.
    validations:
      required: false

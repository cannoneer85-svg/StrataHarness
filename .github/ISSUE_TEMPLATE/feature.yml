name: Feature Request
description: Suggest an idea or new capability for the Template
title: "feat: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement or new feature!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am trying to... but...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new feature you would like to see.
      placeholder: Clear and concise description of the proposed feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, examples, or screenshots here.
    validations:
      required: false

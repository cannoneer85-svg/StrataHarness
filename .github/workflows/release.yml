name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          .agents/skills/release/scripts/Invoke-Release.ps1 -Notes $env:GITHUB_REF_NAME

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
        shell: pwsh
        run: |
          $releaseTitle = if (-not [string]::IsNullOrWhiteSpace($env:TITLE)) {
              $env:TITLE
          } elseif (Test-Path -LiteralPath '.scratch/release/release-title.txt') {
              (Get-Content -LiteralPath '.scratch/release/release-title.txt' -Raw -Encoding utf8).Trim()
          } else {
              $env:TAG
          }

          $notesFile = '.scratch/release/release-notes.md'
          $prereleaseArgs = if ($env:TAG -match '-rc') { @('--prerelease') } else { @() }
          gh release create $env:TAG --title $releaseTitle --notes-file $notesFile @prereleaseArgs
